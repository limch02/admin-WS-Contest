<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | CNU Room</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <div><b>📚 CNU Room</b></div>
    <nav>
        <a href="/">홈</a>
        <a href="/register">회원가입</a>
    </nav>
</header>

<main class="login-main">
    <div class="login-container">
        <div class="login-content">
            <h2>로그인</h2>
            <p class="login-subtitle">강의실 예약 시스템에 오신 것을 환영합니다</p>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" placeholder="학번 또는 관리자 ID" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호 입력" required autocomplete="current-password">
                    <div class="password-toggle">
                        <button type="button" class="toggle-password-btn" onclick="togglePassword()">
                            <span id="toggle-icon">👁️</span>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <span>로그인 상태 유지</span>
                    </label>
                    <a href="#" class="forgot-password">비밀번호 찾기</a>
                </div>
                
                <div id="error-message" class="error-message" style="display: none;"></div>
                
                <button type="submit" class="login-submit-btn" id="login-btn">
                    <span id="login-btn-text">로그인</span>
                    <span id="login-loading" style="display: none;">로그인 중...</span>
                </button>
            </form>
            
            <div class="login-footer">
                <p>아직 계정이 없으신가요? <a href="/register">회원가입</a></p>
            </div>
        </div>
    </div>
</main>

<footer>© 2025 CNU Room Reservation System</footer>

<script>
    // 비밀번호 표시/숨기기
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            toggleIcon.textContent = '👁️';
        }
    }
    
    // 에러 메시지 표시
    function showError(message) {
        const errorDiv = document.getElementById('error-message');
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
    }
    
    // 에러 메시지 숨기기
    function hideError() {
        const errorDiv = document.getElementById('error-message');
        errorDiv.style.display = 'none';
    }
    
    // 로그인 폼 제출
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('remember-me').checked;
        
        // 기본 검증
        if (!username) {
            showError('아이디를 입력해주세요.');
            return;
        }
        
        if (!password) {
            showError('비밀번호를 입력해주세요.');
            return;
        }
        
        // 로딩 상태 표시
        const loginBtn = document.getElementById('login-btn');
        const loginBtnText = document.getElementById('login-btn-text');
        const loginLoading = document.getElementById('login-loading');
        
        loginBtn.disabled = true;
        loginBtnText.style.display = 'none';
        loginLoading.style.display = 'inline';
        hideError();
        
        try {
            // 실제 API 호출
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    loginId: username,
                    password: password
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // 로그인 성공
                console.log('로그인 응답 데이터:', data);
                console.log('토큰 존재:', !!data.token);
                console.log('로그인 ID:', data.loginId);
                console.log('역할:', data.role);
                
                // JWT 토큰 저장
                if (!data.token) {
                    showError('토큰을 받지 못했습니다. 다시 시도해주세요.');
                    loginBtn.disabled = false;
                    loginBtnText.style.display = 'inline';
                    loginLoading.style.display = 'none';
                    return;
                }
                
                localStorage.setItem('token', data.token);
                localStorage.setItem('loginId', data.loginId);
                localStorage.setItem('role', data.role);
                
                console.log('localStorage 저장 완료:', {
                    token: localStorage.getItem('token') ? '저장됨' : '없음',
                    loginId: localStorage.getItem('loginId'),
                    role: localStorage.getItem('role')
                });
                
                // 로그인 상태 유지 옵션 처리
                if (rememberMe) {
                    localStorage.setItem('savedUsername', username);
                } else {
                    localStorage.removeItem('savedUsername');
                }
                
                alert('로그인되었습니다.');
                
                // 관리자인 경우 관리자 페이지로, 아니면 홈으로 이동
                if (data.role === 'ADMIN') {
                    window.location.href = '/admin';
                } else {
                    window.location.href = '/';
                }
            } else {
                // 로그인 실패
                showError(data.error || '로그인에 실패했습니다. ID와 비밀번호를 확인해주세요.');
                loginBtn.disabled = false;
                loginBtnText.style.display = 'inline';
                loginLoading.style.display = 'none';
            }
        } catch (error) {
            console.error('로그인 오류:', error);
            showError('로그인 중 오류가 발생했습니다. 다시 시도해주세요.');
            loginBtn.disabled = false;
            loginBtnText.style.display = 'inline';
            loginLoading.style.display = 'none';
        }
    });
    
    // 입력 필드에서 Enter 키 처리
    document.getElementById('username').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('password').focus();
        }
    });
    
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('login-form').dispatchEvent(new Event('submit'));
        }
    });
    
    // 페이지 로드 시 저장된 아이디 불러오기
    document.addEventListener('DOMContentLoaded', function() {
        const savedUsername = localStorage.getItem('savedUsername');
        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
            document.getElementById('remember-me').checked = true;
        }
    });
</script>
</body>
</html>
