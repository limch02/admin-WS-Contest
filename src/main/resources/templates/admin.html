<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 | CNU Room</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <div><b>⚙️ 관리자 페이지</b></div>
    <nav>
        <a href="/">홈</a>
        <a href="#" onclick="logout()">로그아웃</a>
    </nav>
</header>

<main class="admin-main">
    <!-- 강의실 관리 섹션 -->
    <div class="admin-section">
        <div class="section-header">
            <h2>강의실 관리</h2>
            <button class="add-room-btn" onclick="openAddRoomModal()">+ 강의실 추가</button>
        </div>
        
        <div class="table-container">
            <table class="admin-table" id="classrooms-table">
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>위치</th>
                        <th>수용인원</th>
                        <th>비품</th>
                        <th>예약 횟수</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody id="classrooms-tbody">
                    <!-- 강의실 목록이 동적으로 생성됩니다 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 통계 섹션 -->
    <div class="admin-section">
        <div class="section-header">
            <h2>예약 통계</h2>
        </div>
        <div class="statistics-container">
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>전체 예약</h4>
                    <p id="total-reservations">0</p>
                </div>
                <div class="stat-card">
                    <h4>활성 예약</h4>
                    <p id="active-reservations">0</p>
                </div>
                <div class="stat-card">
                    <h4>전체 사용자</h4>
                    <p id="total-users">0</p>
                </div>
                <div class="stat-card">
                    <h4>전체 강의실</h4>
                    <p id="total-classrooms">0</p>
                </div>
            </div>
            <h3>가장 인기 많은 강의실 Top 5</h3>
            <div id="top-classrooms-list" class="top-classrooms-list">
                <!-- 통계 목록이 동적으로 생성됩니다 -->
            </div>
        </div>
    </div>

    <!-- 사용자 관리 섹션 -->
    <div class="admin-section">
        <div class="section-header">
            <h2>사용자 관리</h2>
        </div>
        <div class="table-container">
            <table class="admin-table" id="users-table">
                <thead>
                    <tr>
                        <th>아이디</th>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>역할</th>
                        <th>예약 횟수</th>
                        <th>가입일</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <!-- 사용자 목록이 동적으로 생성됩니다 -->
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- 강의실 추가/수정 모달 -->
<div id="room-modal" class="modal">
    <div class="modal-content modal-large">
        <span class="close" onclick="closeRoomModal()">&times;</span>
        <h3 id="modal-title">강의실 추가</h3>
        
        <form id="room-form" class="admin-form">
            <div class="form-group">
                <label for="room-name">강의실 이름 *</label>
                <input type="text" id="room-name" name="room-name" placeholder="예: 301호" required>
            </div>
            
            <div class="form-group">
                <label for="room-location">위치 *</label>
                <input type="text" id="room-location" name="room-location" placeholder="예: 본관 3층" required>
            </div>
            
            <div class="form-group">
                <label for="room-capacity">수용인원 *</label>
                <input type="number" id="room-capacity" name="room-capacity" min="1" placeholder="예: 30" required>
            </div>
            
            <div class="form-group">
                <label>비품</label>
                <div class="equipment-checkboxes">
                    <label class="checkbox-label">
                        <input type="checkbox" id="equipment-projector" name="equipment" value="프로젝터">
                        <span>프로젝터</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="equipment-whiteboard" name="equipment" value="화이트보드">
                        <span>화이트보드</span>
                    </label>
                </div>
            </div>
            
            <div id="form-error" class="error-message" style="display: none;"></div>
            
            <div class="modal-actions">
                <button type="button" class="cancel-modal-btn" onclick="closeRoomModal()">취소</button>
                <button type="submit" class="submit-modal-btn" id="submit-btn">추가</button>
            </div>
        </form>
    </div>
</div>

<footer>© 2025 CNU Room Reservation System</footer>

<script>
    // JWT 토큰 가져오기
    function getAuthToken() {
        return localStorage.getItem('token');
    }

    // API 호출 헤더 설정
    function getAuthHeaders() {
        const token = getAuthToken();
        if (!token || token.trim() === '') {
            throw new Error('토큰이 없습니다. 로그인이 필요합니다.');
        }
        
        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        };
        
        return headers;
    }

    // API 에러 처리 (응답 본문은 읽지 않고 상태만 확인)
    function handleApiError(response) {
        if (!response.ok) {
            let errorMessage = '알 수 없는 오류가 발생했습니다.';
            
            if (response.status === 401) {
                errorMessage = '인증이 필요합니다. 로그인 후 다시 시도해주세요.';
            } else if (response.status === 403) {
                errorMessage = '권한이 없습니다. 관리자 계정으로 로그인해주세요.';
            } else {
                errorMessage = `HTTP ${response.status}: ${response.statusText}`;
            }
            
            throw new Error(errorMessage);
        }
    }

    // 로그아웃
    function logout() {
        if (confirm('로그아웃 하시겠습니까?')) {
            localStorage.removeItem('token');
            localStorage.removeItem('loginId');
            localStorage.removeItem('role');
            window.location.href = '/login';
        }
    }

    // 강의실 데이터
    let classrooms = [];
    let editingRoomId = null; // 수정 중인 강의실 ID
    let adminStats = null; // 관리자 통계
    let users = []; // 사용자 목록
    
    // 강의실 목록 로드
    async function loadClassrooms() {
        try {
            const token = getAuthToken();
            console.log('=== 강의실 목록 API 호출 시작 ===');
            console.log('Token 존재:', !!token);
            
            const headers = getAuthHeaders();
            console.log('Request Headers:', {
                'Content-Type': headers['Content-Type'],
                'Authorization': headers['Authorization'] ? headers['Authorization'].substring(0, 30) + '...' : '없음'
            });
            
            const response = await fetch('/api/classrooms', {
                method: 'GET',
                headers: headers
            });
            
            console.log('Response Status:', response.status);
            console.log('Response OK:', response.ok);
            
            if (!response.ok) {
                let errorText = '';
                try {
                    errorText = await response.clone().text();
                    console.log('Error Response Body:', errorText);
                } catch (e) {
                    console.log('Error reading response body');
                }
                handleApiError(response);
                return;
            }
            
            classrooms = await response.json();
            console.log('강의실 데이터 로드 성공, 개수:', classrooms.length);
            
            // 예약 횟수는 별도로 조회 (통계 API에서)
            if (adminStats) {
                const popularMap = new Map();
                adminStats.popularClassrooms.forEach(pop => {
                    popularMap.set(pop.roomId, pop.reservationCount);
                });
                classrooms.forEach(room => {
                    room.reservationCount = popularMap.get(room.id) || 0;
                });
            }
            
            renderClassrooms();
        } catch (error) {
            console.error('강의실 목록 로드 실패:', error);
            alert('강의실 목록을 불러오는 중 오류가 발생했습니다: ' + error.message);
        }
    }

    // 강의실 목록 렌더링
    function renderClassrooms() {
        const tbody = document.getElementById('classrooms-tbody');
        tbody.innerHTML = '';
        
        if (classrooms.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 30px;">등록된 강의실이 없습니다.</td></tr>';
            return;
        }
        
        classrooms.forEach(room => {
            const tr = document.createElement('tr');
            const equipment = [];
            if (room.hasProjector) equipment.push('프로젝터');
            if (room.hasWhiteboard) equipment.push('화이트보드');
            const equipmentText = equipment.length > 0 ? equipment.join(', ') : '없음';
            const reservationCount = room.reservationCount || 0;
            
            tr.innerHTML = `
                <td>${room.name}</td>
                <td>${room.location}</td>
                <td>${room.capacity}명</td>
                <td>${equipmentText}</td>
                <td>${reservationCount}회</td>
                <td class="action-buttons">
                    <button class="edit-btn" onclick="openEditRoomModal(${room.id})">수정</button>
                    <button class="delete-btn" onclick="deleteRoom(${room.id})">삭제</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
    
    // 관리자 통계 로드
    async function loadAdminStats() {
        try {
            const token = getAuthToken();
            console.log('=== 통계 API 호출 시작 ===');
            console.log('Token 존재:', !!token);
            console.log('Token 시작 부분:', token ? token.substring(0, 20) + '...' : '없음');
            
            const headers = getAuthHeaders();
            console.log('Request Headers:', {
                'Content-Type': headers['Content-Type'],
                'Authorization': headers['Authorization'] ? headers['Authorization'].substring(0, 30) + '...' : '없음'
            });
            
            const response = await fetch('/api/admin/stats', {
                method: 'GET',
                headers: headers
            });
            
            console.log('Response Status:', response.status);
            console.log('Response OK:', response.ok);
            
            // 에러 처리 (응답 본문 확인)
            if (!response.ok) {
                let errorText = '';
                try {
                    errorText = await response.clone().text();
                    console.log('Error Response Body:', errorText);
                    try {
                        const errorJson = JSON.parse(errorText);
                        console.log('Error JSON:', errorJson);
                    } catch (e) {
                        console.log('Error body is not JSON');
                    }
                } catch (e) {
                    console.log('Error reading response body');
                }
                
                // 에러 처리 함수 호출 (응답 본문은 이미 읽었으므로 상태만 확인)
                handleApiError(response);
                return; // 에러 처리 후 함수 종료
            }
            
            // 성공 응답 처리
            adminStats = await response.json();
            console.log('통계 데이터 로드 성공:', adminStats);
            
            renderStatistics();
        } catch (error) {
            console.error('통계 로드 실패:', error);
            console.error('Error stack:', error.stack);
            alert('통계를 불러오는 중 오류가 발생했습니다: ' + error.message);
        }
    }

    // 통계 렌더링
    function renderStatistics() {
        if (!adminStats) return;
        
        // 통계 카드 업데이트
        document.getElementById('total-reservations').textContent = adminStats.totalReservations || 0;
        document.getElementById('active-reservations').textContent = adminStats.activeReservations || 0;
        document.getElementById('total-users').textContent = adminStats.totalUsers || 0;
        document.getElementById('total-classrooms').textContent = adminStats.totalClassrooms || 0;
        
        // Top 5 강의실
        const topList = document.getElementById('top-classrooms-list');
        topList.innerHTML = '';
        
        if (!adminStats.popularClassrooms || adminStats.popularClassrooms.length === 0) {
            topList.innerHTML = '<p>예약 데이터가 없습니다.</p>';
            return;
        }
        
        adminStats.popularClassrooms.forEach((pop, index) => {
            const item = document.createElement('div');
            item.className = 'top-classroom-item';
            
            // 강의실 이름 찾기
            const classroom = classrooms.find(c => c.id === pop.roomId);
            const roomName = classroom ? classroom.name : pop.roomName;
            const roomLocation = classroom ? classroom.location : '';
            const roomCapacity = classroom ? classroom.capacity : '';
            
            item.innerHTML = `
                <div class="rank">${index + 1}</div>
                <div class="room-info">
                    <div class="room-name">${roomName}</div>
                    <div class="room-details">${roomLocation} ${roomCapacity ? '· ' + roomCapacity + '명' : ''}</div>
                </div>
                <div class="reservation-count">${pop.reservationCount}회</div>
            `;
            topList.appendChild(item);
        });
    }

    // 사용자 목록 로드
    async function loadUsers() {
        try {
            const headers = getAuthHeaders();
            console.log('=== 사용자 목록 API 호출 시작 ===');
            
            const response = await fetch('/api/admin/users', {
                method: 'GET',
                headers: headers
            });
            
            console.log('사용자 목록 Response Status:', response.status);
            
            if (!response.ok) {
                let errorText = '';
                try {
                    errorText = await response.clone().text();
                    console.log('Error Response Body:', errorText);
                } catch (e) {
                    console.log('Error reading response body');
                }
                handleApiError(response);
                return;
            }
            
            users = await response.json();
            console.log('사용자 데이터 로드 성공, 개수:', users.length);
            
            renderUsers();
        } catch (error) {
            console.error('사용자 목록 로드 실패:', error);
            alert('사용자 목록을 불러오는 중 오류가 발생했습니다: ' + error.message);
        }
    }

    // 사용자 목록 렌더링
    function renderUsers() {
        const tbody = document.getElementById('users-tbody');
        tbody.innerHTML = '';
        
        if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 30px;">등록된 사용자가 없습니다.</td></tr>';
            return;
        }
        
        users.forEach(user => {
            const tr = document.createElement('tr');
            const createdAt = user.createdAt ? new Date(user.createdAt).toLocaleDateString('ko-KR') : '-';
            
            tr.innerHTML = `
                <td>${user.loginId}</td>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td>
                    <select onchange="updateUserRole(${user.userId}, this.value)" class="role-select">
                        <option value="STUDENT" ${user.role === 'STUDENT' ? 'selected' : ''}>학생</option>
                        <option value="ADMIN" ${user.role === 'ADMIN' ? 'selected' : ''}>관리자</option>
                    </select>
                </td>
                <td>${user.reservationNum || 0}회</td>
                <td>${createdAt}</td>
                <td class="action-buttons">
                    <button class="delete-btn" onclick="deleteUser(${user.userId}, '${user.name}')">삭제</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 사용자 역할 변경
    async function updateUserRole(userId, role) {
        if (!confirm(`사용자 역할을 ${role === 'ADMIN' ? '관리자' : '학생'}로 변경하시겠습니까?`)) {
            // 취소 시 원래 값으로 복구
            loadUsers();
            return;
        }
        
        try {
            const response = await fetch(`/api/admin/users/${userId}/role`, {
                method: 'PUT',
                headers: getAuthHeaders(),
                body: JSON.stringify({ role: role })
            });
            
            await handleApiError(response);
            alert('사용자 역할이 변경되었습니다.');
            await loadUsers();
        } catch (error) {
            console.error('역할 변경 실패:', error);
            alert('역할 변경 중 오류가 발생했습니다: ' + error.message);
            loadUsers(); // 실패 시 목록 새로고침
        }
    }

    // 사용자 삭제
    async function deleteUser(userId, userName) {
        if (!confirm(`"${userName}" 사용자를 정말 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.`)) {
            return;
        }
        
        try {
            const response = await fetch(`/api/admin/users/${userId}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });
            
            await handleApiError(response);
            alert('사용자가 삭제되었습니다.');
            await loadUsers();
        } catch (error) {
            console.error('사용자 삭제 실패:', error);
            alert('사용자 삭제 중 오류가 발생했습니다: ' + error.message);
        }
    }
    
    // 강의실 추가 모달 열기
    function openAddRoomModal() {
        editingRoomId = null;
        document.getElementById('modal-title').textContent = '강의실 추가';
        document.getElementById('submit-btn').textContent = '추가';
        document.getElementById('room-form').reset();
        document.getElementById('form-error').style.display = 'none';
        document.getElementById('room-modal').style.display = 'block';
    }
    
    // 강의실 수정 모달 열기
    function openEditRoomModal(roomId) {
        const room = classrooms.find(r => r.id === roomId);
        if (!room) return;
        
        editingRoomId = roomId;
        document.getElementById('modal-title').textContent = '강의실 수정';
        document.getElementById('submit-btn').textContent = '수정';
        
        // 폼에 데이터 채우기
        document.getElementById('room-name').value = room.name;
        document.getElementById('room-location').value = room.location;
        document.getElementById('room-capacity').value = room.capacity;
        
        // 비품 체크박스 초기화
        document.getElementById('equipment-projector').checked = room.hasProjector || false;
        document.getElementById('equipment-whiteboard').checked = room.hasWhiteboard || false;
        
        document.getElementById('form-error').style.display = 'none';
        document.getElementById('room-modal').style.display = 'block';
    }
    
    // 모달 닫기
    function closeRoomModal() {
        document.getElementById('room-modal').style.display = 'none';
        editingRoomId = null;
        document.getElementById('room-form').reset();
    }
    
    // 폼 제출 처리
    document.getElementById('room-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('room-name').value.trim();
        const location = document.getElementById('room-location').value.trim();
        const capacity = parseInt(document.getElementById('room-capacity').value);
        const hasProjector = document.getElementById('equipment-projector').checked;
        const hasWhiteboard = document.getElementById('equipment-whiteboard').checked;
        
        const errorDiv = document.getElementById('form-error');
        
        // 검증
        if (!name || !location || !capacity || capacity < 1) {
            errorDiv.textContent = '모든 필드를 올바르게 입력해주세요.';
            errorDiv.style.display = 'block';
            return;
        }
        
        errorDiv.style.display = 'none';
        
        try {
            const roomData = {
                name: name,
                location: location,
                capacity: capacity,
                hasProjector: hasProjector,
                hasWhiteboard: hasWhiteboard,
                availableDate: null  // 서버에서 모든 날짜에 사용 가능하도록 1900-01-01로 설정됨
            };
            
            if (editingRoomId) {
                // 수정
                const response = await fetch(`/api/classrooms/${editingRoomId}`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(roomData)
                });
                
                await handleApiError(response);
                alert('강의실 정보가 수정되었습니다.');
                await loadClassrooms();
            } else {
                // 추가
                const response = await fetch('/api/classrooms', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(roomData)
                });
                
                await handleApiError(response);
                alert('강의실이 추가되었습니다.');
                await loadClassrooms();
            }
            
            closeRoomModal();
            await loadAdminStats(); // 통계 새로고침
        } catch (error) {
            console.error('강의실 저장 실패:', error);
            errorDiv.textContent = error.message || '강의실 저장 중 오류가 발생했습니다.';
            errorDiv.style.display = 'block';
        }
    });
    
    // 강의실 삭제
    async function deleteRoom(roomId) {
        const room = classrooms.find(r => r.id === roomId);
        if (!room) return;
        
        if (!confirm(`"${room.name}" 강의실을 정말 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.`)) {
            return;
        }
        
        try {
            const response = await fetch(`/api/classrooms/${roomId}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });
            
            await handleApiError(response);
            alert('강의실이 삭제되었습니다.');
            await loadClassrooms();
            await loadAdminStats(); // 통계 새로고침
        } catch (error) {
            console.error('강의실 삭제 실패:', error);
            alert('강의실 삭제 중 오류가 발생했습니다: ' + error.message);
        }
    }
    
    // 모달 외부 클릭 시 닫기
    window.onclick = function(event) {
        const modal = document.getElementById('room-modal');
        if (event.target === modal) {
            closeRoomModal();
        }
    }
    
    // 로그인 상태 확인
    function checkAdminAuth() {
        const token = getAuthToken();
        const role = localStorage.getItem('role');
        
        if (!token || token.trim() === '' || role !== 'ADMIN') {
            alert('관리자 권한이 필요합니다.');
            window.location.href = '/login';
            return false;
        }
        
        // 토큰이 있는지 확인
        console.log('관리자 인증 확인:', { token: token ? '존재' : '없음', role: role });
        
        return true;
    }

    // 페이지 로드 시 초기화
    document.addEventListener('DOMContentLoaded', async function() {
        // localStorage 내용 확인 (디버깅)
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        const loginId = localStorage.getItem('loginId');
        
        console.log('=== 관리자 페이지 초기화 ===');
        console.log('Token 존재:', !!token);
        console.log('Token 길이:', token ? token.length : 0);
        console.log('Role:', role);
        console.log('LoginId:', loginId);
        
        if (!checkAdminAuth()) {
            console.log('관리자 인증 실패 - 페이지 초기화 중단');
            return;
        }
        
        console.log('관리자 인증 성공 - 데이터 로드 시작');
        
        // 순차적으로 데이터 로드 (동시 요청 시 일부가 실패할 수 있음)
        try {
            // 사용자 목록 먼저 로드 (이미 성공하는 것으로 확인)
            await loadUsers();
            console.log('1. 사용자 목록 로드 완료');
            
            // 그 다음 강의실 목록
            await loadClassrooms();
            console.log('2. 강의실 목록 로드 완료');
            
            // 마지막으로 통계
            await loadAdminStats();
            console.log('3. 통계 로드 완료');
            
            console.log('모든 데이터 로드 완료');
        } catch (error) {
            console.error('데이터 로드 중 오류:', error);
        }
    });
</script>
</body>
</html>
