<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | CNU Room</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <div><b>📚 CNU Room</b></div>
    <nav>
        <a href="/">홈</a>
        <a href="/login">로그인</a>
    </nav>
</header>

<main class="login-main">
    <div class="login-container">
        <div class="login-content">
            <h2>회원가입</h2>
            <p class="login-subtitle">강의실 예약 시스템에 가입하세요</p>
            
            <form id="register-form" class="login-form">
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" placeholder="이름 입력" required>
                </div>
                
                <div class="form-group">
                    <label for="loginId">아이디</label>
                    <input type="text" id="loginId" name="loginId" placeholder="학번 또는 관리자 ID" required>
                </div>
                
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="이메일 주소" required>
                </div>
                
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>
                </div>
                
                <div id="error-message" class="error-message" style="display: none;"></div>
                <div id="success-message" class="success-message" style="display: none;"></div>
                
                <button type="submit" class="login-submit-btn" id="register-btn">
                    <span id="register-btn-text">가입하기</span>
                    <span id="register-loading" style="display: none;">가입 중...</span>
                </button>
            </form>
            
            <div class="login-footer">
                <p>이미 계정이 있으신가요? <a href="/login">로그인</a></p>
            </div>
        </div>
    </div>
</main>

<footer>© 2025 CNU Room Reservation System</footer>

<script>
    // 에러 메시지 표시
    function showError(message) {
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
    }
    
    // 성공 메시지 표시
    function showSuccess(message) {
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
        successDiv.textContent = message;
        successDiv.style.display = 'block';
        errorDiv.style.display = 'none';
    }
    
    // 메시지 숨기기
    function hideMessages() {
        document.getElementById('error-message').style.display = 'none';
        document.getElementById('success-message').style.display = 'none';
    }
    
    // 회원가입 폼 제출
    document.getElementById('register-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value.trim();
        const loginId = document.getElementById('loginId').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        
        // 기본 검증
        if (!name) {
            showError('이름을 입력해주세요.');
            return;
        }
        
        if (!loginId) {
            showError('아이디를 입력해주세요.');
            return;
        }
        
        if (!email) {
            showError('이메일을 입력해주세요.');
            return;
        }
        
        if (!password) {
            showError('비밀번호를 입력해주세요.');
            return;
        }
        
        // 이메일 형식 검증
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showError('올바른 이메일 형식을 입력해주세요.');
            return;
        }
        
        // 로딩 상태 표시
        const registerBtn = document.getElementById('register-btn');
        const registerBtnText = document.getElementById('register-btn-text');
        const registerLoading = document.getElementById('register-loading');
        
        registerBtn.disabled = true;
        registerBtnText.style.display = 'none';
        registerLoading.style.display = 'inline';
        hideMessages();
        
        try {
            // 실제 API 호출
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    loginId: loginId,
                    email: email,
                    password: password
                    // 역할은 서버에서 자동으로 STUDENT로 설정됨
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // 회원가입 성공
                showSuccess(data.message || '회원가입이 완료되었습니다.');
                
                // 2초 후 로그인 페이지로 이동
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                // 회원가입 실패
                showError(data.error || '회원가입에 실패했습니다. 다시 시도해주세요.');
                registerBtn.disabled = false;
                registerBtnText.style.display = 'inline';
                registerLoading.style.display = 'none';
            }
        } catch (error) {
            console.error('회원가입 오류:', error);
            showError('회원가입 중 오류가 발생했습니다. 다시 시도해주세요.');
            registerBtn.disabled = false;
            registerBtnText.style.display = 'inline';
            registerLoading.style.display = 'none';
        }
    });
</script>

<style>
    .success-message {
        background-color: #d4edda;
        color: #155724;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 15px;
        border: 1px solid #c3e6cb;
    }
    
    .form-group select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
    }
</style>
</body>
</html>
