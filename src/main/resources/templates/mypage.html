<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 | CNU Room</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <div><b>📚 CNU Room</b></div>
    <nav>
        <a href="/">홈</a>
        <a href="/reserve">예약하기</a>
        <a href="/login" id="login-link">로그인</a>
        <a href="/mypage" id="mypage-link" style="display: none;">마이페이지</a>
        <a href="#" id="logout-link" onclick="logout()" style="display: none;">로그아웃</a>
    </nav>
</header>

<main class="mypage-main">
    <!-- 탭 메뉴 -->
    <div class="mypage-tabs">
        <button class="tab-btn active" id="reservations-tab" onclick="showTab('reservations')">나의 예약 내역</button>
        <button class="tab-btn" id="waitlist-tab" onclick="showTab('waitlist')">나의 대기 신청</button>
        <button class="tab-btn" id="timeline-tab" onclick="showTab('timeline')">강의실 예약 현황</button>
    </div>
    
    <!-- 나의 예약 내역 탭 -->
    <div id="reservations-section" class="mypage-section">
        <h2>나의 예약 내역</h2>
        <div class="table-container">
            <table class="mypage-table" id="reservations-table">
                <thead>
                    <tr>
                        <th>강의실</th>
                        <th>위치</th>
                        <th>날짜</th>
                        <th>시간</th>
                        <th>역할</th>
                        <th>상태</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody id="reservations-tbody">
                    <!-- 예약 목록이 동적으로 생성됩니다 -->
                </tbody>
            </table>
        </div>
        <div id="no-reservations" class="empty-message" style="display: none;">
            예약 내역이 없습니다.
        </div>
    </div>
    
    <!-- 나의 대기 신청 탭 -->
    <div id="waitlist-section" class="mypage-section" style="display: none;">
        <h2>나의 대기 신청</h2>
        <div class="table-container">
            <table class="mypage-table" id="waitlist-table">
                <thead>
                    <tr>
                        <th>강의실</th>
                        <th>날짜</th>
                        <th>시간</th>
                        <th>대기 순위</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody id="waitlist-tbody">
                    <!-- 대기 신청 목록이 동적으로 생성됩니다 -->
                </tbody>
            </table>
        </div>
        <div id="no-waitlist" class="empty-message" style="display: none;">
            대기 신청 내역이 없습니다.
        </div>
    </div>
    
    <!-- 강의실 예약 현황 탭 -->
    <div id="timeline-section" class="mypage-section" style="display: none;">
        <h2>강의실 예약 현황</h2>
        
        <!-- 강의실 선택 -->
        <div class="timeline-controls">
            <div class="form-group">
                <label for="timeline-room-select">강의실 선택:</label>
                <select id="timeline-room-select" class="form-control">
                    <option value="">선택하세요</option>
                </select>
            </div>
            <div class="form-group">
                <label for="timeline-start-date">시작 날짜:</label>
                <input type="date" id="timeline-start-date" class="form-control">
            </div>
            <div class="form-group">
                <label for="timeline-end-date">종료 날짜:</label>
                <input type="date" id="timeline-end-date" class="form-control">
            </div>
            <button class="search-btn" onclick="loadTimeline()">조회</button>
        </div>
        
        <!-- 타임라인 표시 -->
        <div id="timeline-container" class="timeline-container" style="display: none;">
            <h3 id="timeline-room-name"></h3>
            <div id="timeline-content" class="timeline-content">
                <!-- 타임라인이 동적으로 생성됩니다 -->
            </div>
        </div>
        
        <div id="no-timeline" class="empty-message" style="display: none;">
            예약 현황이 없습니다.
        </div>
    </div>
    
    <div class="alert-box">
        <p>📌 예약 시작 10분 전까지만 취소 가능합니다.</p>
        <p>📌 예약 취소 시 대기 순위에 따라 자동으로 예약이 할당될 수 있습니다.</p>
    </div>
</main>

<footer>© 2025 CNU Room Reservation System</footer>

<script>
    // JWT 토큰 가져오기
    function getAuthToken() {
        return localStorage.getItem('token');
    }
    
    // 로그인 상태 확인 및 UI 업데이트
    function checkLoginStatus() {
        const token = localStorage.getItem('token');
        const loginLink = document.getElementById('login-link');
        const mypageLink = document.getElementById('mypage-link');
        const logoutLink = document.getElementById('logout-link');
        
        if (token) {
            loginLink.style.display = 'none';
            mypageLink.style.display = 'inline';
            logoutLink.style.display = 'inline';
        } else {
            loginLink.style.display = 'inline';
            mypageLink.style.display = 'none';
            logoutLink.style.display = 'none';
        }
    }
    
    // 로그아웃
    function logout() {
        if (confirm('로그아웃 하시겠습니까?')) {
            localStorage.removeItem('token');
            localStorage.removeItem('loginId');
            localStorage.removeItem('role');
            window.location.href = '/login';
        }
    }
    
    // 탭 전환
    function showTab(tabName) {
        // 모든 탭 숨기기
        document.getElementById('reservations-section').style.display = 'none';
        document.getElementById('waitlist-section').style.display = 'none';
        document.getElementById('timeline-section').style.display = 'none';
        
        // 모든 탭 버튼 비활성화
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        // 선택한 탭 표시
        if (tabName === 'reservations') {
            document.getElementById('reservations-section').style.display = 'block';
            document.getElementById('reservations-tab').classList.add('active');
            loadMyReservations();
        } else if (tabName === 'waitlist') {
            document.getElementById('waitlist-section').style.display = 'block';
            document.getElementById('waitlist-tab').classList.add('active');
            loadMyWaitlists();
        } else if (tabName === 'timeline') {
            document.getElementById('timeline-section').style.display = 'block';
            document.getElementById('timeline-tab').classList.add('active');
            loadClassrooms();
        }
    }
    
    // 나의 예약 내역 로드
    async function loadMyReservations() {
        const token = getAuthToken();
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login';
            return;
        }
        
        try {
            const response = await fetch('/api/reservations/my', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            
            if (!response.ok) {
                if (response.status === 401) {
                    alert('로그인이 필요합니다.');
                    window.location.href = '/login';
                    return;
                }
                throw new Error('예약 내역 조회 실패');
            }
            
            const reservations = await response.json();
            renderReservations(reservations);
        } catch (error) {
            console.error('예약 내역 로드 오류:', error);
            alert('예약 내역을 불러오는 중 오류가 발생했습니다.');
        }
    }
    
    // 예약 목록 렌더링
    function renderReservations(reservations) {
        const tbody = document.getElementById('reservations-tbody');
        const noReservations = document.getElementById('no-reservations');
        
        tbody.innerHTML = '';
        
        if (reservations.length === 0) {
            noReservations.style.display = 'block';
            return;
        }
        
        noReservations.style.display = 'none';
        
        reservations.forEach(reservation => {
            const tr = document.createElement('tr');
            const date = new Date(reservation.date + 'T00:00:00');
            const formattedDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            const timeRange = `${String(reservation.startHour).padStart(2, '0')}:00 ~ ${String(reservation.endHour).padStart(2, '0')}:00`;
            
            let statusBadge = '';
            if (reservation.status === 'ACTIVE') {
                statusBadge = '<span class="status-badge confirmed">확정</span>';
            } else if (reservation.status === 'CANCELLED') {
                statusBadge = '<span class="status-badge cancelled">취소됨</span>';
            }
            
            // 본인이 예약한 것인지 참여한 것인지 표시
            const roleBadge = reservation.isOwner ? 
                '<span class="role-badge owner" style="background-color: #4CAF50; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px;">예약자</span>' : 
                '<span class="role-badge participant" style="background-color: #2196F3; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px;">참여자</span>';
            
            let cancelButton = '';
            if (reservation.canCancel) {
                cancelButton = `<button class="cancel-reservation-btn" onclick="cancelReservation(${reservation.reservationId})">취소</button>`;
            } else {
                if (reservation.status === 'CANCELLED') {
                    cancelButton = '<span style="color: #999;">이미 취소됨</span>';
                } else if (reservation.isOwner) {
                    cancelButton = '<span style="color: #999;">취소 불가</span>';
                } else {
                    cancelButton = '<span style="color: #999;">참여자는 취소 불가</span>';
                }
            }
            
            tr.innerHTML = `
                <td>${reservation.roomName}</td>
                <td>${reservation.location}</td>
                <td>${formattedDate}</td>
                <td>${timeRange}</td>
                <td>${roleBadge}</td>
                <td>${statusBadge}</td>
                <td>${cancelButton}</td>
            `;
            tbody.appendChild(tr);
        });
    }
    
    // 나의 대기 신청 목록 로드
    async function loadMyWaitlists() {
        const token = getAuthToken();
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login';
            return;
        }
        
        try {
            const response = await fetch('/api/waitlist/my', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            
            if (!response.ok) {
                if (response.status === 401) {
                    alert('로그인이 필요합니다.');
                    window.location.href = '/login';
                    return;
                }
                throw new Error('대기 신청 목록 조회 실패');
            }
            
            const waitlists = await response.json();
            renderWaitlists(waitlists);
        } catch (error) {
            console.error('대기 신청 목록 로드 오류:', error);
            alert('대기 신청 목록을 불러오는 중 오류가 발생했습니다.');
        }
    }
    
    // 대기 신청 목록 렌더링
    function renderWaitlists(waitlists) {
        const tbody = document.getElementById('waitlist-tbody');
        const noWaitlist = document.getElementById('no-waitlist');
        
        tbody.innerHTML = '';
        
        if (waitlists.length === 0) {
            noWaitlist.style.display = 'block';
            return;
        }
        
        noWaitlist.style.display = 'none';
        
        waitlists.forEach(waitlist => {
            const tr = document.createElement('tr');
            const date = new Date(waitlist.date + 'T00:00:00');
            const formattedDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            const timeRange = `${String(waitlist.startHour).padStart(2, '0')}:00 ~ ${String(waitlist.endHour).padStart(2, '0')}:00`;
            
            tr.innerHTML = `
                <td>${waitlist.roomName}</td>
                <td>${formattedDate}</td>
                <td>${timeRange}</td>
                <td><span class="waitlist-priority">${waitlist.queuePosition}순위</span></td>
                <td>
                    <button class="cancel-waitlist-btn" onclick="cancelWaitlist(${waitlist.waitlistId})">취소</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
    
    // 대기 신청 취소
    async function cancelWaitlist(waitlistId) {
        if (!confirm('정말 대기 신청을 취소하시겠습니까?')) {
            return;
        }
        
        const token = getAuthToken();
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login';
            return;
        }
        
        try {
            const response = await fetch(`/api/waitlist/${waitlistId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            
            const data = await response.json();
            
            if (response.ok) {
                alert(data.message || '대기 신청이 취소되었습니다.');
                loadMyWaitlists(); // 목록 새로고침
            } else {
                alert(data.error || '대기 신청 취소에 실패했습니다.');
            }
        } catch (error) {
            console.error('대기 신청 취소 오류:', error);
            alert('대기 신청 취소 중 오류가 발생했습니다.');
        }
    }
    
    // 예약 취소
    async function cancelReservation(reservationId) {
        if (!confirm('정말 예약을 취소하시겠습니까?')) {
            return;
        }
        
        const token = getAuthToken();
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login';
            return;
        }
        
        try {
            const response = await fetch(`/api/reservations/${reservationId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            
            const data = await response.json();
            
            if (response.ok) {
                alert(data.message || '예약이 취소되었습니다.');
                loadMyReservations(); // 목록 새로고침
            } else {
                alert(data.error || '예약 취소에 실패했습니다.');
            }
        } catch (error) {
            console.error('예약 취소 오류:', error);
            alert('예약 취소 중 오류가 발생했습니다.');
        }
    }
    
    // 강의실 목록 로드 (타임라인용)
    async function loadClassrooms() {
        try {
            const response = await fetch('/api/classrooms', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            
            if (response.ok) {
                const classrooms = await response.json();
                const select = document.getElementById('timeline-room-select');
                select.innerHTML = '<option value="">선택하세요</option>';
                
                classrooms.forEach(classroom => {
                    const option = document.createElement('option');
                    option.value = classroom.id;
                    option.textContent = `${classroom.name} (${classroom.location})`;
                    select.appendChild(option);
                });
                
                // 기본 날짜 설정
                const today = new Date();
                const nextWeek = new Date(today);
                nextWeek.setDate(today.getDate() + 7);
                
                document.getElementById('timeline-start-date').value = today.toISOString().split('T')[0];
                document.getElementById('timeline-end-date').value = nextWeek.toISOString().split('T')[0];
            }
        } catch (error) {
            console.error('강의실 목록 로드 오류:', error);
        }
    }
    
    // 타임라인 로드
    async function loadTimeline() {
        const roomId = document.getElementById('timeline-room-select').value;
        const startDate = document.getElementById('timeline-start-date').value;
        const endDate = document.getElementById('timeline-end-date').value;
        
        if (!roomId) {
            alert('강의실을 선택해주세요.');
            return;
        }
        
        if (!startDate || !endDate) {
            alert('날짜를 선택해주세요.');
            return;
        }
        
        try {
            const response = await fetch(`/api/reservations/room/${roomId}/timeline?startDate=${startDate}&endDate=${endDate}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            
            if (!response.ok) {
                throw new Error('타임라인 조회 실패');
            }
            
            const timeline = await response.json();
            renderTimeline(timeline, roomId);
        } catch (error) {
            console.error('타임라인 로드 오류:', error);
            alert('타임라인을 불러오는 중 오류가 발생했습니다.');
        }
    }
    
    // 타임라인 렌더링
    function renderTimeline(timeline, roomId) {
        const container = document.getElementById('timeline-container');
        const content = document.getElementById('timeline-content');
        const noTimeline = document.getElementById('no-timeline');
        const roomSelect = document.getElementById('timeline-room-select');
        const selectedOption = roomSelect.options[roomSelect.selectedIndex];
        
        if (timeline.length === 0) {
            container.style.display = 'none';
            noTimeline.style.display = 'block';
            return;
        }
        
        container.style.display = 'block';
        noTimeline.style.display = 'none';
        
        // 날짜별로 그룹화
        const groupedByDate = {};
        timeline.forEach(item => {
            if (!groupedByDate[item.date]) {
                groupedByDate[item.date] = [];
            }
            groupedByDate[item.date].push(item);
        });
        
        // 날짜 정렬
        const sortedDates = Object.keys(groupedByDate).sort();
        
        let html = '';
        sortedDates.forEach(date => {
            const dateObj = new Date(date + 'T00:00:00');
            const formattedDate = `${dateObj.getFullYear()}년 ${dateObj.getMonth() + 1}월 ${dateObj.getDate()}일`;
            html += `<div class="timeline-date-group"><h4>${formattedDate}</h4>`;
            
            groupedByDate[date].forEach(item => {
                const timeRange = `${String(item.startHour).padStart(2, '0')}:00 ~ ${String(item.endHour).padStart(2, '0')}:00`;
                html += `
                    <div class="timeline-item">
                        <div class="timeline-time">${timeRange}</div>
                        <div class="timeline-user">${item.userName} (${item.userLoginId})</div>
                    </div>
                `;
            });
            
            html += '</div>';
        });
        
        document.getElementById('timeline-room-name').textContent = selectedOption.textContent;
        content.innerHTML = html;
    }
    
    // 페이지 로드 시
    document.addEventListener('DOMContentLoaded', async function() {
        checkLoginStatus();
        
        // 로그인 확인
        const token = getAuthToken();
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login';
            return;
        }
        
        // 인증 확인
        try {
            const response = await fetch('/api/auth/me', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            if (!response.ok) {
                localStorage.removeItem('token');
                localStorage.removeItem('loginId');
                localStorage.removeItem('role');
                alert('로그인이 필요합니다.');
                window.location.href = '/login';
                return;
            }
            
            // 기본 탭 로드
            loadMyReservations();
        } catch (error) {
            console.error('인증 확인 오류:', error);
            localStorage.removeItem('token');
            localStorage.removeItem('loginId');
            localStorage.removeItem('role');
            alert('로그인이 필요합니다.');
            window.location.href = '/login';
        }
    });
</script>
</body>
</html>
