<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 상세 정보 | CNU Room</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <div><b>📚 CNU Room</b></div>
    <nav>
        <a href="/">홈</a>
        <a href="/reserve">예약하기</a>
        <a href="/login" id="login-link">로그인</a>
        <a href="#" id="mypage-link" style="display: none;">마이페이지</a>
        <a href="#" id="logout-link" onclick="logout()" style="display: none;">로그아웃</a>
    </nav>
</header>

<main class="reservation-detail-main">
    <div class="detail-container">
        <h2>예약 상세 정보</h2>
        
        <!-- 선택된 정보 표시 -->
        <div class="selected-info">
            <div class="info-item">
                <label>날짜:</label>
                <span id="display-date"></span>
            </div>
            <div class="info-item">
                <label>강의실:</label>
                <span id="display-room"></span>
            </div>
            <div class="info-item">
                <label>시작 시간:</label>
                <span id="display-time"></span>
            </div>
        </div>
        
        <!-- 예약 시간 선택 -->
        <div class="duration-section">
            <h3>예약 시간</h3>
            <div class="duration-buttons">
                <button class="duration-btn" data-duration="1" onclick="selectDuration(1)">1시간</button>
                <button class="duration-btn" data-duration="2" onclick="selectDuration(2)">2시간</button>
            </div>
            <p class="duration-display" id="duration-display">시작 시간: <span id="start-time-display"></span> ~ 종료 시간: <span id="end-time-display"></span></p>
        </div>
        
        <!-- 모임 정보 -->
        <div class="meeting-info-section">
            <h3>모임 정보</h3>
            <div class="form-group">
                <label for="meeting-name">모임명</label>
                <input type="text" id="meeting-name" placeholder="모임명을 입력하세요">
            </div>
            <div class="form-group">
                <label for="meeting-note">기타(전달사항)</label>
                <textarea id="meeting-note" placeholder="전달사항을 입력하세요" rows="3"></textarea>
            </div>
        </div>
        
        <!-- 그룹 사용자 추가 -->
        <div class="group-members-section">
            <h3>참여 인원</h3>
            <p class="instruction">대표 예약자 외에 참석 예정인 이용자를 개별 등록하여 주십시오.</p>
            
            <div class="add-member-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="student-id">이용자 번호(학번) *</label>
                        <input type="text" id="student-id" placeholder="학번을 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label for="student-name">이용자 이름 (선택사항)</label>
                        <input type="text" id="student-name" placeholder="이름을 입력하면 검증합니다 (선택사항)">
                    </div>
                </div>
                <button class="register-btn" onclick="registerMember()">이용자 등록</button>
            </div>
            
            <!-- 등록된 멤버 목록 -->
            <div class="members-list">
                <h4>등록된 참여 인원</h4>
                <div class="members-count">
                    <span>대표 예약자: <strong id="main-booking-user">-</strong></span>
                    <span>참여 인원: <strong id="members-count">0</strong>명</span>
                    <span>최소 인원: <strong id="min-people-display">0</strong>명</span>
                </div>
                <ul id="members-list" class="members-ul">
                    <!-- 등록된 멤버들이 동적으로 추가됩니다 -->
                </ul>
            </div>
        </div>
        
        <!-- 설명 섹션 -->
        <div class="info-box">
            <p><strong>Justice: What's the Right Thing to Do?</strong></p>
            <p>최대한 편리하게 이용하고, 또한 강력하게 제재합니다.</p>
        </div>
        
        <!-- 예약 버튼 -->
        <div class="reservation-actions">
            <button class="cancel-btn" onclick="cancelReservation()">취소</button>
            <button class="reserve-btn" id="reserve-btn" onclick="completeReservation()" disabled>예약</button>
        </div>
    </div>
</main>

<footer>© 2025 CNU Room Reservation System</footer>

<script>
    // URL 파라미터에서 정보 가져오기
    const urlParams = new URLSearchParams(window.location.search);
    const selectedDate = urlParams.get('date') || '';
    const roomId = parseInt(urlParams.get('roomId')) || 0;
    const selectedHour = parseInt(urlParams.get('hour')) || 9;
    const roomName = decodeURIComponent(urlParams.get('roomName') || '');
    const capacity = parseInt(urlParams.get('capacity')) || 10;
    
    // 선택된 정보 표시
    if (selectedDate) {
        const dateObj = new Date(selectedDate + 'T00:00:00');
        const formattedDate = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        document.getElementById('display-date').textContent = formattedDate;
    }
    document.getElementById('display-room').textContent = roomName;
    document.getElementById('display-time').textContent = `${String(selectedHour).padStart(2, '0')}:00`;
    document.getElementById('start-time-display').textContent = `${String(selectedHour).padStart(2, '0')}:00`;

    // 상태 변수
    let selectedDuration = 1; // 기본 1시간
    let registeredMembers = []; // 등록된 멤버 목록
    
    // 21시일 때 2시간 버튼 비활성화
    function updateDurationButtons() {
        const durationButtons = document.querySelectorAll('.duration-btn');
        durationButtons.forEach(btn => {
            const duration = parseInt(btn.dataset.duration);
            if (selectedHour === 21 && duration === 2) {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.style.cursor = 'not-allowed';
            } else {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            }
        });
    }

    // 예약 시간 선택
    function selectDuration(duration) {
        // 21시일 때 2시간 예약 불가
        if (selectedHour === 21 && duration === 2) {
            alert('21시는 2시간 예약이 불가능합니다. 1시간만 선택 가능합니다.');
            return;
        }
        
        // 22시는 선택 불가 (1시간 예약도 불가)
        if (selectedHour >= 22) {
            alert('22시는 예약할 수 없습니다.');
            return;
        }
        
        selectedDuration = duration;
        const buttons = document.querySelectorAll('.duration-btn');
        buttons.forEach(btn => {
            btn.classList.remove('active');
            if (parseInt(btn.dataset.duration) === duration) {
                btn.classList.add('active');
            }
        });
        
        const endHour = selectedHour + duration;
        const endTimeDisplay = endHour <= 22 ? `${String(endHour).padStart(2, '0')}:00` : '22:00 (종료)';
        document.getElementById('end-time-display').textContent = endTimeDisplay;
        updateReserveButton();
    }
    
    // 기본으로 1시간 선택
    selectDuration(1);
    
    // 멤버 등록
    async function registerMember() {
        const studentId = document.getElementById('student-id').value.trim();
        const studentName = document.getElementById('student-name').value.trim();
        
        if (!studentId) {
            alert('학번을 입력해주세요.');
            return;
        }
        
        // 이미 등록된 멤버인지 확인
        if (registeredMembers.some(m => m.studentId === studentId)) {
            alert('이미 등록된 사용자입니다.');
            return;
        }
        
        try {
            // DB에서 사용자 검색 (학번으로)
            const response = await fetch(`/api/auth/users/search?loginId=${encodeURIComponent(studentId)}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // DB에 존재하는 학생인 경우
                // 이름은 DB에서 가져온 이름 사용
                const dbName = data.name;
                const reservationCount = data.reservationCount || 0;
                const canParticipate = data.canParticipate !== undefined ? data.canParticipate : true;
                
                // 예약 개수 체크 (3개 이상이면 참여 불가)
                if (!canParticipate || reservationCount >= 3) {
                    alert(`"${dbName}"님의 활성화된 예약이 3개 이상입니다.\n해당 사용자는 예약에 참여할 수 없습니다.`);
                    return;
                }
                
                // 입력한 이름이 있으면 검증 (선택사항)
                if (studentName && studentName.trim() !== '' && studentName !== dbName) {
                    if (!confirm(`입력한 이름("${studentName}")과 등록된 이름("${dbName}")이 다릅니다.\n등록된 이름("${dbName}")으로 등록하시겠습니까?`)) {
                        return;
                    }
                }
                
                // 예약 개수 경고 (2개인 경우)
                if (reservationCount === 2) {
                    if (!confirm(`"${dbName}"님의 현재 활성 예약이 2개입니다.\n이 예약에 참여하면 예약 가능 개수를 초과하게 됩니다.\n계속하시겠습니까?`)) {
                        return;
                    }
                }
                
                // 정원 체크 (대표 예약자 1명 + 현재 멤버 수 + 새로 추가할 멤버 1명)
                const totalPeople = registeredMembers.length + 1 + 1; // 대표 + 현재 멤버 + 새 멤버
                if (totalPeople > capacity) {
                    alert(`강의실 정원(${capacity}명)을 초과합니다.\n현재 참여 인원: ${registeredMembers.length + 1}명\n추가하려는 인원: ${totalPeople}명\n정원: ${capacity}명\n\n멤버를 추가할 수 없습니다.`);
                    return;
                }
                
                // 멤버 추가
                registeredMembers.push({
                    studentId: studentId,
                    studentName: dbName
                });
                
                // 목록 업데이트
                updateMembersList();
                
                // 입력 필드 초기화
                document.getElementById('student-id').value = '';
                document.getElementById('student-name').value = '';
                
                // 정원에 도달했는지 확인
                const finalTotal = registeredMembers.length + 1;
                if (finalTotal >= capacity) {
                    alert(`${dbName}님이 등록되었습니다.\n\n⚠️ 정원에 도달했습니다. 더 이상 멤버를 추가할 수 없습니다.`);
                } else {
                    alert(`${dbName}님이 등록되었습니다.`);
                }
            } else {
                // DB에 존재하지 않는 경우
                alert(data.error || '해당 학번의 사용자를 찾을 수 없습니다. 먼저 회원가입을 해주세요.');
            }
        } catch (error) {
            console.error('사용자 검색 오류:', error);
            alert('사용자 검색 중 오류가 발생했습니다. 다시 시도해주세요.');
        }
    }
    
    // 멤버 목록 업데이트
    function updateMembersList() {
        const membersList = document.getElementById('members-list');
        membersList.innerHTML = '';
        
        const totalPeople = registeredMembers.length + 1; // 대표 예약자 포함
        const remainingCapacity = capacity - totalPeople;
        
        if (registeredMembers.length === 0) {
            const li = document.createElement('li');
            li.className = 'member-item';
            li.innerHTML = '<span style="color: #999;">등록된 참여 인원이 없습니다.</span>';
            membersList.appendChild(li);
        } else {
            registeredMembers.forEach((member, index) => {
                const li = document.createElement('li');
                li.className = 'member-item';
                li.innerHTML = `
                    <span>${member.studentName} (${member.studentId})</span>
                    <button class="remove-btn" onclick="removeMember(${index})">삭제</button>
                `;
                membersList.appendChild(li);
            });
        }
        
        document.getElementById('members-count').textContent = registeredMembers.length;
        
        // 정원 정보 업데이트
        const membersCountDiv = document.querySelector('.members-count');
        if (membersCountDiv && totalPeople >= capacity) {
            // 정원에 도달했거나 초과한 경우 경고 메시지
            if (totalPeople > capacity) {
                membersCountDiv.style.color = 'red';
                membersCountDiv.innerHTML = `
                    <span>대표 예약자: <strong>1명</strong></span>
                    <span>참여 인원: <strong style="color: red;">${registeredMembers.length}명</strong></span>
                    <span style="color: red;">⚠️ 정원(${capacity}명) 초과! 현재: ${totalPeople}명</span>
                `;
            } else {
                membersCountDiv.style.color = 'orange';
                membersCountDiv.innerHTML = `
                    <span>대표 예약자: <strong>1명</strong></span>
                    <span>참여 인원: <strong>${registeredMembers.length}명</strong></span>
                    <span style="color: orange;">⚠️ 정원(${capacity}명)에 도달했습니다</span>
                `;
            }
        } else {
            membersCountDiv.style.color = '';
            membersCountDiv.innerHTML = `
                <span>대표 예약자: <strong>1명</strong></span>
                <span>참여 인원: <strong>${registeredMembers.length}명</strong></span>
                <span>정원: <strong>${capacity}명</strong> (남은 인원: ${remainingCapacity}명)</span>
            `;
        }
        
        updateReserveButton();
    }
    
    // 멤버 제거
    function removeMember(index) {
        if (confirm('정말 삭제하시겠습니까?')) {
            registeredMembers.splice(index, 1);
            updateMembersList();
        }
    }
    
    // 예약 버튼 업데이트
    function updateReserveButton() {
        const totalPeople = registeredMembers.length + 1; // 대표 예약자 포함
        const reserveBtn = document.getElementById('reserve-btn');
        
        // 정원 초과 시 예약 버튼 비활성화
        if (totalPeople > capacity) {
            reserveBtn.disabled = true;
            reserveBtn.classList.remove('enabled');
            reserveBtn.title = `정원(${capacity}명)을 초과했습니다. 현재 인원: ${totalPeople}명`;
        } else if (totalPeople === 0) {
            reserveBtn.disabled = true;
            reserveBtn.classList.remove('enabled');
            reserveBtn.title = '최소 1명 이상 필요합니다.';
        } else {
            reserveBtn.disabled = false;
            reserveBtn.classList.add('enabled');
            reserveBtn.title = '';
        }
    }
    
    // 예약 완료
    async function completeReservation() {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login';
            return;
        }
        
        const meetingName = document.getElementById('meeting-name').value.trim();
        const meetingNote = document.getElementById('meeting-note').value.trim();
        const totalPeople = registeredMembers.length + 1;
        
        if (!meetingName) {
            alert('모임명을 입력해주세요.');
            return;
        }
        
        // 정원 최종 체크
        if (totalPeople > capacity) {
            alert(`강의실 정원(${capacity}명)을 초과했습니다.\n현재 참여 인원: ${totalPeople}명\n\n일부 멤버를 제거한 후 다시 시도해주세요.`);
            return;
        }
        
        if (totalPeople < 1) {
            alert('최소 1명 이상 필요합니다.');
            return;
        }

        // 로그인한 사용자 정보 가져오기
        let representativeId;
        let representativeName;
        try {
            const userResponse = await fetch('/api/auth/me', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            if (userResponse.ok) {
                const userInfo = await userResponse.json();
                representativeId = userInfo.loginId;
                // 이름은 추가 API 호출 필요하거나, 현재 정보에서 가져오기
                representativeName = userInfo.name || representativeId;
            } else {
                alert('사용자 정보를 가져올 수 없습니다. 다시 로그인해주세요.');
                window.location.href = '/login';
                return;
            }
        } catch (error) {
            console.error('사용자 정보 가져오기 실패:', error);
            alert('사용자 정보를 가져오는 중 오류가 발생했습니다.');
            return;
        }

        // 예약 정보 구성
        const reservationData = {
            roomId: roomId,
            date: selectedDate,
            startHour: selectedHour,
            endHour: selectedHour + selectedDuration,
            representativeId: representativeId,
            representativeName: representativeName,
            members: registeredMembers.map(m => ({
                studentId: m.studentId,
                studentName: m.studentName
            }))
        };
        
        try {
            // 실제 예약 API 호출
            const response = await fetch('/api/reservations', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(reservationData)
            });
            
            const data = await response.json();
            
            if (response.ok) {
                alert(`예약이 완료되었습니다!\n\n등록된 모든 인원(${totalPeople}명)에게 알림이 발송되었습니다.\n\n날짜: ${selectedDate}\n강의실: ${roomName}\n시간: ${String(selectedHour).padStart(2, '0')}:00 ~ ${String(selectedHour + selectedDuration).padStart(2, '0')}:00\n참여 인원: ${totalPeople}명`);
                
                // 예약 완료 후 홈으로 이동
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                alert(data.error || '예약 생성에 실패했습니다. 다시 시도해주세요.');
            }
        } catch (error) {
            console.error('예약 생성 오류:', error);
            alert('예약 생성 중 오류가 발생했습니다. 다시 시도해주세요.');
        }
    }
    
    // 예약 완료 후 대기 순위 확인 (다른 페이지에서 예약이 생성되었을 때)
    function checkWaitlistAfterReservation(roomId, date, hour) {
        // 실제로는 서버에서 처리
        // 여기서는 localStorage 기반으로 동작 확인
        console.log('예약 완료 후 대기 순위 확인:', { roomId, date, hour });
    }
    
    // 예약 취소
    function cancelReservation() {
        if (confirm('예약을 취소하시겠습니까?')) {
            window.location.href = '/reserve';
        }
    }
    
    // 로그인 상태 확인 및 UI 업데이트
    function checkLoginStatus() {
        const token = localStorage.getItem('token');
        const loginLink = document.getElementById('login-link');
        const mypageLink = document.getElementById('mypage-link');
        const logoutLink = document.getElementById('logout-link');
        
        if (token) {
            // 로그인된 경우
            loginLink.style.display = 'none';
            mypageLink.style.display = 'inline';
            logoutLink.style.display = 'inline';
        } else {
            // 로그인되지 않은 경우
            loginLink.style.display = 'inline';
            mypageLink.style.display = 'none';
            logoutLink.style.display = 'none';
        }
    }
    
    // 로그아웃
    function logout() {
        if (confirm('로그아웃 하시겠습니까?')) {
            localStorage.removeItem('token');
            localStorage.removeItem('loginId');
            localStorage.removeItem('role');
            window.location.href = '/login';
        }
    }
    
    // 대표 예약자 정보 업데이트
    async function updateMainBookingUser() {
        const token = localStorage.getItem('token');
        if (token) {
            try {
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const userInfo = await response.json();
                    // 사용자 이름 가져오기 (추가 API 호출 필요할 수 있음)
                    // 현재는 loginId만 표시
                    document.getElementById('main-booking-user').textContent = userInfo.loginId || '로그인 사용자';
                }
            } catch (error) {
                console.error('대표 예약자 정보 가져오기 실패:', error);
            }
        } else {
            document.getElementById('main-booking-user').textContent = '로그인 필요';
        }
    }
    
    // 로그인 상태 확인 및 리다이렉트
    async function checkAuthAndRedirect() {
        const token = localStorage.getItem('token');
        if (!token || token.trim() === '' || token === 'null' || token === 'undefined') {
            alert('로그인이 필요합니다.');
            window.location.href = '/login';
            return false;
        }
        
        try {
            const response = await fetch('/api/auth/me', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            if (!response.ok) {
                localStorage.removeItem('token');
                localStorage.removeItem('loginId');
                localStorage.removeItem('role');
                alert('로그인이 필요합니다.');
                window.location.href = '/login';
                return false;
            }
            
            return true;
        } catch (error) {
            console.error('인증 확인 오류:', error);
            localStorage.removeItem('token');
            localStorage.removeItem('loginId');
            localStorage.removeItem('role');
            alert('로그인이 필요합니다.');
            window.location.href = '/login';
            return false;
        }
    }
    
    // 페이지 로드 시 로그인 상태 확인 및 대표 예약자 정보 업데이트
    document.addEventListener('DOMContentLoaded', async function() {
        const isAuthenticated = await checkAuthAndRedirect();
        if (isAuthenticated) {
            checkLoginStatus();
            updateMainBookingUser();
            updateMembersList();
            updateDurationButtons(); // 21시일 때 2시간 버튼 비활성화
        }
    });
</script>
</body>
</html>
