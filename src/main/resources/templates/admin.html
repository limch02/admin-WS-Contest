<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 | CNU Room</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
<header>
    <div><b>⚙️ 관리자 페이지</b></div>
    <nav>
        <a href="index.html">홈</a>
        <a href="logout.html">로그아웃</a>
    </nav>
</header>

<main class="admin-main">
    <!-- 강의실 관리 섹션 -->
    <div class="admin-section">
        <div class="section-header">
            <h2>강의실 관리</h2>
            <button class="add-room-btn" onclick="openAddRoomModal()">+ 강의실 추가</button>
        </div>
        
        <div class="table-container">
            <table class="admin-table" id="classrooms-table">
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>위치</th>
                        <th>수용인원</th>
                        <th>비품</th>
                        <th>예약 횟수</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody id="classrooms-tbody">
                    <!-- 강의실 목록이 동적으로 생성됩니다 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 통계 섹션 -->
    <div class="admin-section">
        <div class="section-header">
            <h2>예약 통계</h2>
        </div>
        <div class="statistics-container">
            <h3>가장 인기 많은 강의실 Top 5</h3>
            <div id="top-classrooms-list" class="top-classrooms-list">
                <!-- 통계 목록이 동적으로 생성됩니다 -->
            </div>
        </div>
    </div>
</main>

<!-- 강의실 추가/수정 모달 -->
<div id="room-modal" class="modal">
    <div class="modal-content modal-large">
        <span class="close" onclick="closeRoomModal()">&times;</span>
        <h3 id="modal-title">강의실 추가</h3>
        
        <form id="room-form" class="admin-form">
            <div class="form-group">
                <label for="room-name">강의실 이름 *</label>
                <input type="text" id="room-name" name="room-name" placeholder="예: 301호" required>
            </div>
            
            <div class="form-group">
                <label for="room-location">위치 *</label>
                <input type="text" id="room-location" name="room-location" placeholder="예: 본관 3층" required>
            </div>
            
            <div class="form-group">
                <label for="room-capacity">수용인원 *</label>
                <input type="number" id="room-capacity" name="room-capacity" min="1" placeholder="예: 30" required>
            </div>
            
            <div class="form-group">
                <label>비품</label>
                <div class="equipment-checkboxes">
                    <label class="checkbox-label">
                        <input type="checkbox" id="equipment-projector" name="equipment" value="프로젝터">
                        <span>프로젝터</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="equipment-whiteboard" name="equipment" value="화이트보드">
                        <span>화이트보드</span>
                    </label>
                </div>
            </div>
            
            <div id="form-error" class="error-message" style="display: none;"></div>
            
            <div class="modal-actions">
                <button type="button" class="cancel-modal-btn" onclick="closeRoomModal()">취소</button>
                <button type="submit" class="submit-modal-btn" id="submit-btn">추가</button>
            </div>
        </form>
    </div>
</div>

<footer>© 2025 CNU Room Reservation System</footer>

<script>
    // 강의실 데이터 (프론트엔드 시뮬레이션)
    let classrooms = JSON.parse(localStorage.getItem('admin_classrooms')) || [
        { id: 1, name: '[1F] 그룹스터디 01', location: '1층', capacity: 10, equipment: ['프로젝터', '화이트보드'], reservationCount: 45 },
        { id: 2, name: '[1F] 그룹스터디 02', location: '1층', capacity: 10, equipment: ['프로젝터'], reservationCount: 38 },
        { id: 3, name: '[1F] 그룹스터디 03', location: '1층', capacity: 10, equipment: ['화이트보드'], reservationCount: 32 },
        { id: 4, name: '[1F] 그룹스터디 04', location: '1층', capacity: 10, equipment: [], reservationCount: 28 },
        { id: 5, name: '[1F] 그룹스터디 05', location: '1층', capacity: 6, equipment: ['프로젝터', '화이트보드'], reservationCount: 42 },
        { id: 6, name: '[2F] 강의실 A', location: '2층', capacity: 30, equipment: ['프로젝터', '화이트보드'], reservationCount: 67 },
        { id: 7, name: '[2F] 강의실 B', location: '2층', capacity: 25, equipment: ['프로젝터'], reservationCount: 54 }
    ];
    
    let editingRoomId = null; // 수정 중인 강의실 ID
    
    // 데이터 저장
    function saveClassrooms() {
        localStorage.setItem('admin_classrooms', JSON.stringify(classrooms));
    }
    
    // 강의실 목록 렌더링
    function renderClassrooms() {
        const tbody = document.getElementById('classrooms-tbody');
        tbody.innerHTML = '';
        
        if (classrooms.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 30px;">등록된 강의실이 없습니다.</td></tr>';
            return;
        }
        
        classrooms.forEach(room => {
            const tr = document.createElement('tr');
            const equipmentText = room.equipment.length > 0 ? room.equipment.join(', ') : '없음';
            
            tr.innerHTML = `
                <td>${room.name}</td>
                <td>${room.location}</td>
                <td>${room.capacity}명</td>
                <td>${equipmentText}</td>
                <td>${room.reservationCount}회</td>
                <td class="action-buttons">
                    <button class="edit-btn" onclick="openEditRoomModal(${room.id})">수정</button>
                    <button class="delete-btn" onclick="deleteRoom(${room.id})">삭제</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        // 통계 업데이트
        updateStatistics();
    }
    
    // 통계 업데이트 (Top 5)
    function updateStatistics() {
        const topList = document.getElementById('top-classrooms-list');
        topList.innerHTML = '';
        
        // 예약 횟수로 정렬
        const sorted = [...classrooms].sort((a, b) => b.reservationCount - a.reservationCount);
        const top5 = sorted.slice(0, 5);
        
        if (top5.length === 0) {
            topList.innerHTML = '<p>예약 데이터가 없습니다.</p>';
            return;
        }
        
        top5.forEach((room, index) => {
            const item = document.createElement('div');
            item.className = 'top-classroom-item';
            item.innerHTML = `
                <div class="rank">${index + 1}</div>
                <div class="room-info">
                    <div class="room-name">${room.name}</div>
                    <div class="room-details">${room.location} · ${room.capacity}명</div>
                </div>
                <div class="reservation-count">${room.reservationCount}회</div>
            `;
            topList.appendChild(item);
        });
    }
    
    // 강의실 추가 모달 열기
    function openAddRoomModal() {
        editingRoomId = null;
        document.getElementById('modal-title').textContent = '강의실 추가';
        document.getElementById('submit-btn').textContent = '추가';
        document.getElementById('room-form').reset();
        document.getElementById('form-error').style.display = 'none';
        document.getElementById('room-modal').style.display = 'block';
    }
    
    // 강의실 수정 모달 열기
    function openEditRoomModal(roomId) {
        const room = classrooms.find(r => r.id === roomId);
        if (!room) return;
        
        editingRoomId = roomId;
        document.getElementById('modal-title').textContent = '강의실 수정';
        document.getElementById('submit-btn').textContent = '수정';
        
        // 폼에 데이터 채우기
        document.getElementById('room-name').value = room.name;
        document.getElementById('room-location').value = room.location;
        document.getElementById('room-capacity').value = room.capacity;
        
        // 비품 체크박스 초기화
        document.getElementById('equipment-projector').checked = room.equipment.includes('프로젝터');
        document.getElementById('equipment-whiteboard').checked = room.equipment.includes('화이트보드');
        
        document.getElementById('form-error').style.display = 'none';
        document.getElementById('room-modal').style.display = 'block';
    }
    
    // 모달 닫기
    function closeRoomModal() {
        document.getElementById('room-modal').style.display = 'none';
        editingRoomId = null;
        document.getElementById('room-form').reset();
    }
    
    // 폼 제출 처리
    document.getElementById('room-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('room-name').value.trim();
        const location = document.getElementById('room-location').value.trim();
        const capacity = parseInt(document.getElementById('room-capacity').value);
        
        const errorDiv = document.getElementById('form-error');
        
        // 검증
        if (!name || !location || !capacity || capacity < 1) {
            errorDiv.textContent = '모든 필드를 올바르게 입력해주세요.';
            errorDiv.style.display = 'block';
            return;
        }
        
        // 비품 정보 수집
        const equipment = [];
        if (document.getElementById('equipment-projector').checked) {
            equipment.push('프로젝터');
        }
        if (document.getElementById('equipment-whiteboard').checked) {
            equipment.push('화이트보드');
        }
        
        if (editingRoomId) {
            // 수정
            const roomIndex = classrooms.findIndex(r => r.id === editingRoomId);
            if (roomIndex !== -1) {
                classrooms[roomIndex] = {
                    ...classrooms[roomIndex],
                    name: name,
                    location: location,
                    capacity: capacity,
                    equipment: equipment
                };
                saveClassrooms();
                renderClassrooms();
                closeRoomModal();
                alert('강의실 정보가 수정되었습니다.');
            }
        } else {
            // 추가
            const newId = classrooms.length > 0 ? Math.max(...classrooms.map(r => r.id)) + 1 : 1;
            const newRoom = {
                id: newId,
                name: name,
                location: location,
                capacity: capacity,
                equipment: equipment,
                reservationCount: 0
            };
            classrooms.push(newRoom);
            saveClassrooms();
            renderClassrooms();
            closeRoomModal();
            alert('강의실이 추가되었습니다.');
        }
    });
    
    // 강의실 삭제
    function deleteRoom(roomId) {
        const room = classrooms.find(r => r.id === roomId);
        if (!room) return;
        
        if (confirm(`"${room.name}" 강의실을 정말 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.`)) {
            classrooms = classrooms.filter(r => r.id !== roomId);
            saveClassrooms();
            renderClassrooms();
            alert('강의실이 삭제되었습니다.');
        }
    }
    
    // 모달 외부 클릭 시 닫기
    window.onclick = function(event) {
        const modal = document.getElementById('room-modal');
        if (event.target === modal) {
            closeRoomModal();
        }
    }
    
    // 페이지 로드 시 강의실 목록 렌더링
    document.addEventListener('DOMContentLoaded', function() {
        renderClassrooms();
    });
</script>
</body>
</html>
