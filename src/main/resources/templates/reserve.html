<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의실 예약 | CNU Room</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <div><b>📚 CNU Room</b></div>
    <nav>
        <a href="/">홈</a>
        <a href="/reserve">예약하기</a>
        <a href="/login" id="login-link">로그인</a>
        <a href="#" id="mypage-link" style="display: none;">마이페이지</a>
        <a href="#" id="logout-link" onclick="logout()" style="display: none;">로그아웃</a>
    </nav>
</header>

<main class="reservation-main">
    <div class="calendar-container">
        <h2>예약 날짜 선택</h2>
        <div class="calendar-header">
            <span id="current-month-year"></span>
        </div>
        <div class="calendar-info">
            <p>현재 날짜 기준 6일까지 예약 가능합니다.</p>
        </div>
        <div class="calendar">
            <div class="calendar-weekdays">
                <div class="weekday">일</div>
                <div class="weekday">월</div>
                <div class="weekday">화</div>
                <div class="weekday">수</div>
                <div class="weekday">목</div>
                <div class="weekday">금</div>
                <div class="weekday">토</div>
            </div>
            <div class="calendar-days" id="calendar-days">
                <!-- 달력 날짜가 동적으로 생성됩니다 -->
            </div>
        </div>
    </div>
</main>

<footer>© 2025 CNU Room Reservation System</footer>

<script>
    // 현재 날짜 가져오기
    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth();
    const currentDate = today.getDate();
    
    // 최대 예약 가능 날짜 (현재 날짜 + 7일)
    const maxDate = new Date(today);
    maxDate.setDate(today.getDate() + 7);
    
    // 달력 초기화
    function initCalendar() {
        const monthYearElement = document.getElementById('current-month-year');
        monthYearElement.textContent = `${currentYear}년 ${currentMonth + 1}월`;
        
        const calendarDays = document.getElementById('calendar-days');
        calendarDays.innerHTML = '';
        
        // 해당 월의 첫 번째 날
        const firstDay = new Date(currentYear, currentMonth, 1);
        const firstDayOfWeek = firstDay.getDay();
        
        // 이전 달의 마지막 날들
        const prevMonthLastDate = new Date(currentYear, currentMonth, 0).getDate();
        
        // 이전 달 날짜들 추가
        for (let i = firstDayOfWeek - 1; i >= 0; i--) {
            const date = prevMonthLastDate - i;
            const dayElement = document.createElement('div');
            dayElement.className = 'calendar-day other-month';
            dayElement.textContent = date;
            calendarDays.appendChild(dayElement);
        }
        
        // 해당 월의 날짜들
        const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
        for (let date = 1; date <= lastDate; date++) {
            const dayElement = document.createElement('div');
            const dateObj = new Date(currentYear, currentMonth, date);
            const dayOfWeek = dateObj.getDay();
            
            // 현재 날짜와 비교하여 예약 가능 여부 확인
            const isPastDate = dateObj < today;
            const isFutureDate = dateObj > maxDate;
            const isToday = date === currentDate && currentMonth === today.getMonth();
            
            dayElement.className = 'calendar-day';
            
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                dayElement.classList.add('weekend');
            }
            
            if (isPastDate || isFutureDate) {
                dayElement.classList.add('disabled');
                dayElement.textContent = date;
            } else {
                dayElement.classList.add('available');
                dayElement.innerHTML = `
                    <span class="date-number">${date}</span>
                    <button class="add-btn" onclick="goToRoomSelection('${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}')">
                        <span class="add-icon">+</span>
                    </button>
                `;
            }
            
            if (isToday) {
                dayElement.classList.add('today');
            }
            
            calendarDays.appendChild(dayElement);
        }
        
        // 다음 달 날짜들로 채우기 (42일 표시를 위해)
        const totalCells = calendarDays.children.length;
        const remainingCells = 42 - totalCells;
        for (let date = 1; date <= remainingCells; date++) {
            const dayElement = document.createElement('div');
            dayElement.className = 'calendar-day other-month';
            dayElement.textContent = date;
            calendarDays.appendChild(dayElement);
        }
    }
    
    // 강의실 선택 화면으로 이동
    function goToRoomSelection(selectedDate) {
        window.location.href = `room-time.html?date=${selectedDate}`;
    }
    
    // 로그인 상태 확인 및 UI 업데이트
    function checkLoginStatus() {
        const token = localStorage.getItem('token');
        const loginLink = document.getElementById('login-link');
        const mypageLink = document.getElementById('mypage-link');
        const logoutLink = document.getElementById('logout-link');
        
        if (token) {
            // 로그인된 경우
            loginLink.style.display = 'none';
            mypageLink.style.display = 'inline';
            logoutLink.style.display = 'inline';
        } else {
            // 로그인되지 않은 경우
            loginLink.style.display = 'inline';
            mypageLink.style.display = 'none';
            logoutLink.style.display = 'none';
        }
    }
    
    // 로그아웃
    function logout() {
        if (confirm('로그아웃 하시겠습니까?')) {
            localStorage.removeItem('token');
            localStorage.removeItem('loginId');
            localStorage.removeItem('role');
            window.location.href = '/login';
        }
    }
    
    // 페이지 로드 시 달력 초기화 및 로그인 상태 확인
    document.addEventListener('DOMContentLoaded', function() {
        initCalendar();
        checkLoginStatus();
    });
</script>
</body>
</html>
