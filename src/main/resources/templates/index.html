<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의실 예약 시스템</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <h1>강의실 예약 시스템</h1>
    <nav>
        <a href="/">홈</a>
        <a href="/login" id="login-link">로그인</a>
        <a href="/register" id="register-link">회원가입</a>
        <a href="/admin" id="admin-link" style="display: none;">관리자</a>
        <a href="#" id="logout-link" onclick="logout()" style="display: none;">로그아웃</a>
    </nav>
</header>

<main class="main-container">
    <section class="intro">
        <h2>환영합니다!</h2>
        <p>이 페이지에서 강의실을 예약하고 관리할 수 있습니다.</p>
        <button onclick="location.href='/reserve'">지금 예약하기</button>
    </section>
</main>

<footer>
    <p>&copy; 2025 CNU 컴퓨터융합학부</p>
</footer>

<script>
    // 토큰 유효성 검증
    async function validateToken() {
        const token = localStorage.getItem('token');
        if (!token || token.trim() === '' || token === 'null' || token === 'undefined') {
            // 토큰이 없거나 비어있으면 정리
            localStorage.removeItem('token');
            localStorage.removeItem('loginId');
            localStorage.removeItem('role');
            return false;
        }
        
        try {
            const response = await fetch('/api/auth/me', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            if (response.ok) {
                return true;
            } else {
                // 토큰이 유효하지 않으면 localStorage 정리
                localStorage.removeItem('token');
                localStorage.removeItem('loginId');
                localStorage.removeItem('role');
                return false;
            }
        } catch (error) {
            console.error('토큰 검증 오류:', error);
            // 오류 발생 시에도 토큰 정리
            localStorage.removeItem('token');
            localStorage.removeItem('loginId');
            localStorage.removeItem('role');
            return false;
        }
    }
    
    // 로그인 상태 확인 및 UI 업데이트
    async function checkLoginStatus() {
        const loginLink = document.getElementById('login-link');
        const registerLink = document.getElementById('register-link');
        const adminLink = document.getElementById('admin-link');
        const logoutLink = document.getElementById('logout-link');
        
        // 초기 상태: 로그아웃 상태로 설정
        loginLink.style.display = 'inline';
        registerLink.style.display = 'inline';
        adminLink.style.display = 'none';
        logoutLink.style.display = 'none';
        
        // 토큰 유효성 확인
        const isValid = await validateToken();
        
        if (isValid) {
            const role = localStorage.getItem('role');
            
            // 로그인된 경우
            loginLink.style.display = 'none';
            registerLink.style.display = 'none';
            logoutLink.style.display = 'inline';
            
            // 관리자인 경우 관리자 페이지 링크 표시
            if (role === 'ADMIN') {
                adminLink.style.display = 'inline';
            }
        }
    }
    
    // 로그아웃
    function logout() {
        if (confirm('로그아웃 하시겠습니까?')) {
            localStorage.removeItem('token');
            localStorage.removeItem('loginId');
            localStorage.removeItem('role');
            window.location.href = '/';
        }
    }
    
    // 페이지 로드 시 로그인 상태 확인
    document.addEventListener('DOMContentLoaded', function() {
        checkLoginStatus();
    });
</script>
</body>
</html>
